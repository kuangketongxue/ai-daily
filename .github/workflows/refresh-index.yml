name: refresh-index

# 每天北京时间 05:40（UTC 21:40）刷新一次索引。
# 源站每天 00:54 更新，这一步保证「日期兜底索引」和「首屏轻量索引」不会停更
# —— 上一次停更是因为完全依赖手动跑脚本，10 天没人跑，首页就老是回落到旧日期。
#
# 2026-11-24 追加：GitHub 的定时事件会被延迟数小时、也会整段丢失（11-23 万星日报
# 全天 7 批一次没到）。单靠一批等于把「今天有没有新内容」押在一次投递上，
# 所以再排两批（北京 08:10 / 12:10），索引无变化时脚本几秒退出、不产生提交。

on:
  schedule:
    - cron: '40 21 * * *'   # 北京 05:40（主力）
    - cron: '10 0 * * *'    # 北京 08:10
    - cron: '10 4 * * *'    # 北京 12:10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成日期索引与首屏轻量索引
        run: python scripts/build-dates.py

      - name: 拉 AI 热点（AIHOT）
        run: python scripts/build-aihot.py

      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dates.js data/dates.json data/latest.json data/aihot.json data/aihot-seen.json
          if git diff --staged --quiet; then
            echo "索引无变化，跳过提交"
          else
            git commit -m "chore: 刷新日报索引 $(date -u +%F)"
            git push
          fi
